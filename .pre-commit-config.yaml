repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [check, src/, tests/]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [src/]
        pass_filenames: false
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: pip-audit-dev
        name: pip-audit (dev)
        entry: bash -c 'pip-audit --format=table --desc && exit 0 || exit 1'
        language: python
        files: pyproject.toml
        pass_filenames: false
        stages: [commit]
